# Production stack untuk absen.jsmu.co.id
# Jalankan dari root repo:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
# atau pakai file ini sendiri (self-contained):
#   docker compose -f deploy/docker-compose.prod.yml up -d
name: jsmuguard

services:
  app:
    build:
      context: ../backend/api
      dockerfile: Dockerfile
    image: jsmuguard-app
    container_name: jsmuguard-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../backend/api:/var/www
      - ../docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf
    depends_on:
      - db
      - redis
    networks: [jsmuguard-network]
    deploy:
      resources:
        limits:
          memory: 1G

  queue:
    image: jsmuguard-app
    container_name: jsmuguard-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-jobs=1000 --timeout=300
    volumes:
      - ../backend/api:/var/www
      - ../docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on: [db, redis, app]
    networks: [jsmuguard-network]
    deploy:
      resources:
        limits:
          memory: 512M

  # Laravel scheduler: app/Console/Kernel.php menjalankan notifications:shift-reminders tiap menit.
  # Tanpa container ini, reminder shift tidak akan pernah jalan.
  scheduler:
    image: jsmuguard-app
    container_name: jsmuguard-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction >> /dev/null 2>&1; sleep 60; done"
    volumes:
      - ../backend/api:/var/www
      - ../docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on: [db, redis, app]
    networks: [jsmuguard-network]
    deploy:
      resources:
        limits:
          memory: 256M

  webserver:
    image: nginx:alpine
    container_name: jsmuguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../backend/api:/var/www
      - ./nginx/absen.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on: [app]
    networks: [jsmuguard-network]
    deploy:
      resources:
        limits:
          memory: 256M

  # Server media untuk Meeting portal (LiveKit)
  livekit:
    image: livekit/livekit-server:v1.8
    container_name: jsmuguard-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "50000-50059:50000-50059/udp"
    networks:
      - jsmuguard-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Editor dokumen daring (Collabora) untuk Penyimpanan Data portal
  collabora:
    image: collabora/code:24.04.9.2.1
    container_name: jsmuguard-collabora
    restart: unless-stopped
    environment:
      # Host WOPI yang boleh memanggil editor ini — hanya situs kita sendiri.
      aliasgroup1: "https://jsmu\\.co\\.id:443"
      server_name: "jsmu.co.id"
      # TLS diselesaikan nginx, jadi Collabora sendiri cukup berbicara HTTP.
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
      DONT_GEN_SSL_CERT: "1"
      username: ""
      password: ""
    cap_add:
      - MKNOD
    networks:
      - jsmuguard-network
    deploy:
      resources:
        limits:
          memory: 1600M

  certbot:
    image: certbot/certbot
    container_name: jsmuguard-certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Cek perpanjangan sertifikat tiap 12 jam
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  db:
    image: mysql:8.0
    container_name: jsmuguard-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
      - ../docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ../docker/mysql/logs:/var/log/mysql
      - ./backups:/backups
    networks: [jsmuguard-network]
    deploy:
      resources:
        limits:
          memory: 2G
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: jsmuguard-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
      - ../docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks: [jsmuguard-network]
    deploy:
      resources:
        limits:
          memory: 512M

  # PhpMyAdmin sengaja HANYA di-bind ke localhost server.
  # Akses dari laptop lewat SSH tunnel:  ssh -L 8081:127.0.0.1:8081 user@vps
  pma:
    image: phpmyadmin/phpmyadmin
    container_name: jsmuguard-pma
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 100M
    networks: [jsmuguard-network]
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  jsmuguard-network:
    driver: bridge

volumes:
  dbdata:
  redisdata:
  certbot-www:
  certbot-conf:

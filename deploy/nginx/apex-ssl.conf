# TAHAP 2 — dipakai setelah sertifikat Let's Encrypt terbit.
# HTTP hanya untuk ACME renewal + redirect ke HTTPS.
server {
    listen 80;
    server_name jsmu.co.id www.jsmu.co.id absen.jsmu.co.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jsmu.co.id$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jsmu.co.id;

    ssl_certificate     /etc/letsencrypt/live/jsmu.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsmu.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/public;
    index index.php index.html;

    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;

    # Upload foto absensi/patroli bisa besar
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss text/javascript;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;

    keepalive_timeout 65;
    keepalive_requests 1000;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Tanpa ini Laravel mengira request-nya HTTP dan generate URL http://
        fastcgi_param HTTPS on;
        fastcgi_keep_conn on;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\.(?!well-known).* { deny all; }
}

# www dan absen dialihkan ke apex supaya hanya ada satu URL kanonik
server {
    listen 443 ssl;
    http2 on;
    server_name www.jsmu.co.id absen.jsmu.co.id;

    ssl_certificate     /etc/letsencrypt/live/jsmu.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsmu.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://jsmu.co.id$request_uri;
}
